{{- $syntaxlight := resources.Get "syntax/highlight.css" | minify -}}
{{- $syntaxdark := resources.Get "syntax/highlight-dark.css" | minify  -}}
<style>
{{ $syntaxlight.Content | safeCSS }}
@media (prefers-color-scheme: dark) {
  body {
    background-color: white;
  }
  html, img, video, iframe {
    filter: invert(1);
  }
  /* undo the forced dark mode for syntax highlighting */
  pre.chroma {
    background: none;
    filter: invert(1);
  }
  /* include proper dark syntax highlights css */
  {{ $syntaxdark.Content | safeCSS }}
}
</style>
